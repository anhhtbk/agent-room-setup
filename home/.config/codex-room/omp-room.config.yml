# Loaded by agent-room with `omp --config` for every Room role session.
# A top-level recursion depth of 0 removes omp's native `task` subagent tool,
# so delegation happens only through Paseo roles.
task:
  maxRecursionDepth: 0
# omp runs background jobs (auto-thinking, job captions and widgets) on the
# `smol` role; omp merges this over the operator's other modelRoles, so Room
# sessions keep those jobs on Sonnet whatever the operator's `smol` is.
modelRoles:
  smol: anthropic/claude-sonnet-5-5
