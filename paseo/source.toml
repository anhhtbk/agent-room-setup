[repository]
url = "https://github.com/getpaseo/paseo.git"
# Each install/update resolves the newest published stable release (never a
# draft, prerelease, or main) and pins its tag->commit for that one install.
release_channel = "latest-stable"
releases_api = "https://api.github.com/repos/getpaseo/paseo/releases"
branch = "main"

[install]
target = "~/projects/supervisors/paseo"
cli_entrypoint = "packages/cli/bin/paseo"
desktop_app = "/Applications/Paseo.app"
paseo_home = "~/.paseo"
listen = "127.0.0.1:6767"
